plugins {
  id 'com.android.library'
  // Pose Kotlin, les niveaux de SDK, la version de Java et la dépendance à
  // expo-modules-core. Tout écrire à la main ici, c'est recopier des valeurs qui
  // suivent la version d'Expo, et les laisser diverger au premier changement.
  id 'expo-module-gradle-plugin'
}

group = 'app.cairn'
version = '0.1.0'

android {
  namespace 'app.cairn.widget'
  // `expo-module-gradle-plugin` les exige : sans elles, la configuration du
  // projet s'arrête sur « 'android.defaultConfig.versionName' is not defined »,
  // avant même que le Kotlin ne soit compilé. Ce sont les versions du module,
  // pas celles de l'application.
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
